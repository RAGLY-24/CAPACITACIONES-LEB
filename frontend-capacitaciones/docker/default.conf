server {
    listen 80;
    root /app/www;

    port_in_redirect off;

    include /etc/nginx/mime.types;

    types {
        application/javascript js mjs;
    }


    location / {
        index index.html index.htm;
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public";
    }
}