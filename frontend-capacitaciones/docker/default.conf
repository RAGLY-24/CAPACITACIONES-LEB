server {
    listen 80;
    root /app/www;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/;

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

}