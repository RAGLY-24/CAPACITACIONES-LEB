name: capacitaciones_dev
services:
  web_dev:
    build:
      context: ./frontend-capacitaciones
      dockerfile: dockerfile.dev
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_APP_TITLE: ${VITE_APP_TITLE}
      VITE_APP_LOGO: ${VITE_APP_LOGO}
    container_name: laravel_web_dev
    ports:
      - "${WEB_PORT:-4000}:3000"
    volumes:
      - ./frontend-capacitaciones:/app
      - /app/node_modules

  app:
    build:
      context: ./backend-capacitaciones
      dockerfile: Dockerfile
    container_name: laravel_api_app_dev
    restart: unless-stopped
    depends_on:
      db_dev:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    env_file:
      - .env
    volumes:
      - ${APP_STORAGE}:/var/www/storage/app/public
      - larabel_data_dev:/var/www/public
    networks:
      - laravel_network_dev

  laravel_dev:
    image: nginx:alpine
    restart: always
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - larabel_data_dev:/var/www/public:ro
      - ./backend-capacitaciones/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      db_dev:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - laravel_network_dev

  db_dev:
    image: mysql:8.0
    container_name: laravel_api_db_dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-laravel}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data_dev:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - laravel_network_dev

networks:
  laravel_network_dev:
    driver: bridge

volumes:
  larabel_data_dev:
  db_data_dev:
