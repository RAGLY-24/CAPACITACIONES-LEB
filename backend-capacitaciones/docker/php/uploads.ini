; Límites de subida/proceso de archivos. Sin esto, PHP usa sus valores por
; defecto (upload_max_filesize=2M, post_max_size=8M), muy por debajo de lo
; que la app ya permite (archivos de módulo hasta 100 MB, imágenes hasta
; 20 MB antes de comprimirse a 5 MB con Intervention Image/GD).
upload_max_filesize = 100M
post_max_size = 120M
memory_limit = 512M
