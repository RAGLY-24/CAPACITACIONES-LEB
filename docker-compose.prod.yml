services:
  web:
    build:
      context: ./frontend-capacitaciones
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${WEB_PORT:-4000}:80"
    
  app:
    build:
      context: ./backend-capacitaciones
      dockerfile: Dockerfile
    container_name: laravel_api_app_prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    env_file:
      - .env
    volumes:
      - ${APP_STORAGE}:/var/www/storage/app/public
      - larabel_data:/var/www/public
    networks:
      - laravel_network

  laravel:
    image: nginx:alpine
    restart: always
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - larabel_data:/var/www/public:ro
      - ./backend-capacitaciones/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel_network

  db:
    image: mysql:8.0
    container_name: laravel_api_db_prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-laravel}
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 5s
        timeout: 5s
        retries: 20
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  larabel_data:
  db_data: