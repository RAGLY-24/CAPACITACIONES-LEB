services:
  web:
    build:
      context: ./frontend-capacitaciones
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${WEB_PORT:-4000}:80"
    
  app:
    build:
      context: ./backend-capacitaciones
      dockerfile: Dockerfile
    container_name: laravel_api_app_prod
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    env_file:
      - .env
    volumes:
      - .env:/var/www/.env
      - ./storage/:/var/www/storage/app/public
    networks:
      - laravel_network

  laravel:
    image: nginx:alpine
    restart: always
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./backend-capacitaciones:/var/www
      - ./backend-capacitaciones/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - db
    networks:
      - laravel_network

  db:
    image: mysql:8.0
    container_name: laravel_api_db_prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-laravel}

    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  db_data: